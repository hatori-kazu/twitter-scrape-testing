name: scrape-tweets

on:
  schedule:
    - cron: "0 * * * *"      # 毎時0分（1時間ごと）
  workflow_dispatch:          # 手動実行も可能

# キャッシュ削除に必要な権限
permissions:
  contents: read
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ① リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # ② Python 3.12 をセットアップ
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ③ 依存パッケージをインストール
      - run: pip install -r requirements.txt

      # ④ accounts.db をキャッシュから復元（存在すれば）
      - name: Restore accounts.db from cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: accounts.db
          key: twscrape-db-${{ github.run_id }}
          restore-keys: |
            twscrape-db-

      # ⑤ キャッシュがなければ Secret から復元（初回のみ）
      - name: Restore accounts.db from secret
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          echo "${{ secrets.TWSCRAPE_DB_B64 }}" | base64 -d > accounts.db
          ls -la accounts.db

      # ⑥ スクレイピングスクリプトを実行
      - name: Run scraper
        run: python scrape.py
        env:
          SALTCORN_API_TOKEN: ${{ secrets.SALTCORN_API_TOKEN }}

      # ⑦ 更新された accounts.db をキャッシュに保存
      - name: Save accounts.db to cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: accounts.db
          key: twscrape-db-${{ github.run_id }}

      # ⑧ 古いキャッシュを削除（最新5件を残す）
      - name: Cleanup old twscrape caches
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Listing twscrape-db caches..."
          gh cache list --repo "$REPO" --key "twscrape-db-" --limit 100 \
            --json id,createdAt,key \
            | jq -r 'sort_by(.createdAt) | reverse | .[5:] | .[].id' \
            > /tmp/old_cache_ids.txt || true

          if [ -s /tmp/old_cache_ids.txt ]; then
            echo "Deleting old caches:"
            cat /tmp/old_cache_ids.txt
            while read -r cache_id; do
              [ -n "$cache_id" ] && gh cache delete "$cache_id" --repo "$REPO" || true
            done < /tmp/old_cache_ids.txt
          else
            echo "No old caches to delete."
          fi
