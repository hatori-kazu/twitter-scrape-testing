name: scrape-tweets

on:
  schedule:
    - cron: "0 * * * *"      # 毎時0分
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -U "Scweet>=5.5.0"
          pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py
        env:
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          SALTCORN_API_TOKEN: ${{ secrets.SALTCORN_API_TOKEN }}
