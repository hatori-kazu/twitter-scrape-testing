name: scrape-tweets

on:
  schedule:
    - cron: "0 * * * *"      # 毎時0分（1時間ごと）
  workflow_dispatch:          # 手動実行も可能

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # ① リポジトリをチェックアウト
      - uses: actions/checkout@v4

      # ② Python 3.12 をセットアップ
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ③ 依存パッケージをインストール
      - run: pip install -r requirements.txt

      # ④ スクレイピングスクリプトを実行
      - name: Run scraper
        run: python scrape.py
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          SALTCORN_API_TOKEN: ${{ secrets.SALTCORN_API_TOKEN }}
