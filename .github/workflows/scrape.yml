name: scrape-tweets
on:
  schedule:
    - cron: "0 * * * *"      # 毎時0分（1時間ごと）
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare data directory
        run: mkdir -p data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python scrape.py
        env:
          SALTCORN_API_TOKEN: ${{ secrets.SALTCORN_API_TOKEN }}
