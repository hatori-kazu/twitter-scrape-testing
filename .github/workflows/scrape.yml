name: scrape-tweets
on:
  schedule:
    - cron: "0 * * * *"      # 毎時0分（1時間ごと）
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Restore twscrape session DB
        uses: actions/cache@v4
        with:
          path: accounts.db
          key: twscrape-db-${{ github.run_id }}
          restore-keys: twscrape-db-

      - run: python scrape.py
        env:
          SALTCORN_API_TOKEN: ${{ secrets.SALTCORN_API_TOKEN }}
